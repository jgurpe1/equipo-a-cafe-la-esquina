<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta · Café La Esquina</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <article class="b-Carta_superior">
    <h2>Nuestra Carta</h2>
    <label>Busca tu capricho diario</label><input type="text" id="busqueda" name="busqueda">
    <!--Ponemos una barra con los botones que filtran la selección de productos. Cada botón llama a un producto con una class similar-->
    <div>
      <button id="btnTodo" class="filtro">Todos</button>
      <button id="btnCafe" class="filtro">Cafés</button>
      <button id="btnDulce" class="filtro">Dulces</button>
      <button id="btnSalado" class="filtro">Salados</button>
    </div>
    <p id="avisoProducto"></p>
  </article>
  <article class= "b-Carta_medio">
    <!--Se hace una caja para englobar todas las opciones de la carta. Los siguientes div corresponden a las fichas de cada producto.
    Cada ficha cuenta con una clase para distinguir su categoria y una clase "producto" para agruparlas a la hora de usar javascript y css
    -->
    <div class="producto tarjetas cafe" id="expresso">
      <img src="https://tse2.mm.bing.net/th/id/OIP.xBGml6-uadDcXp6m70oP2QHaFH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
      <h4>Expresso</h4>
      <p>1,40€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas cafe" id="cafeConLeche">
      <img src="https://cafesriyadh.com/uploads/2020/10/7638d7a6f6fe3ba7.jpg">
      <h4>Cafe con leche</h4>
      <p>1,80€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas cafe" id="">
      <img src="https://cdn7.kiwilimon.com/articuloimagen/31728/31381.jpg">
      <h4>Capuchino</h4>
      <p>2,20€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas dulce" id="">
      <img src="https://static.vecteezy.com/system/resources/previews/043/172/582/non_2x/ai-generated-pile-of-croissants-on-counter-free-photo.jpeg">
      <h4>Croissant</h4>
      <p>1,60€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas dulce" id="">
      <img src="https://simplychickenrecipe.com/wp-content/uploads/2023/08/Whats-in-a-Cake.jpg">
      <h4>Tarta del día</h4>
      <p>3,50€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas dulce" id="">
      <img src="https://tse1.mm.bing.net/th/id/OIP.9JRVUXH-QxYy2RLDMxMG7AHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
      <h4>Galleta de avena</h4>
      <p>1,20€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas salado" id="">
      <img src="https://okdiario.com/img/2018/07/05/receta-de-tostadas-con-tomate-655x368.jpg">
      <h4>Tostada de tomate</h4>
      <p>2,50€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
    <div class="producto tarjetas salado" id="">
      <img src="https://babycocina.com/wp-content/uploads/2019/09/bocadillos-de-tortilla-1300x600.jpg">
      <h4>Bocadillo de tortilla</h4>
      <p>4,00€</p>
      <button class="botones-Añadir">Añadir</button>
    </div>
</article>
  <footer id="foot">
    <p>©2026 Café La Esquina</p>
  </footer>
  <script src="js/main.js"></script>
</body>

</html>
